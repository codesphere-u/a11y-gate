[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "a11y-gate"
version = "0.1.0"
description = "Deterministic static HTML/CSS WCAG 2.2 accessibility, relative-luminance contrast ratio, keyboard-navigation, and Flesch-Kincaid readability CI gate with SARIF v2.1.0 output."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Akandwanaho Ivan Alvin", email = "codesphereinnovationz@gmail.com" },
]
keywords = [
    "accessibility",
    "a11y",
    "wcag",
    "contrast-ratio",
    "readability",
    "sarif",
    "static-analysis",
    "assistive-technology",
    "ci-gate",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[project.scripts]
a11y-gate = "a11y_gate.cli:main"

[project.urls]
Homepage = "https://github.com/codesphere-u/a11y-gate"
Repository = "https://github.com/codesphere-u/a11y-gate"
Issues = "https://github.com/codesphere-u/a11y-gate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/a11y_gate"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["a11y_gate"]
